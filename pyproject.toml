[tool.poetry]
name = "keep-automation-consumer"
version = "0.1.0"
description = "Keep Automations consumer — reads the matched-alerts topic, gates (Redis), and calls the automation API submit endpoint. Commits the matched-topic offset only after an API-acknowledged submit."
authors = ["Keep"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.6"
uvicorn = "^0.34.0"
gunicorn = "^23.0.0"
confluent-kafka = "^2.5.0"
prometheus-client = "^0.21.0"
python-dotenv = "^0.21.1"
redis = "^5.2.0"
httpx = "^0.28.1"
certifi = ">=2024.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
